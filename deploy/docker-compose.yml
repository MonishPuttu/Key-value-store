# Three-node Raft cluster + Prometheus.
#   docker compose -f deploy/docker-compose.yml up --build -d
#   go run ./cmd/kvctl -addr http://localhost:8081 put hello world
#   go run ./cmd/kvctl -addr http://localhost:8082 get hello        # any node works
#   docker compose -f deploy/docker-compose.yml kill kv1             # watch failover
x-node: &node
  build: ..
  restart: unless-stopped

services:
  kv1:
    <<: *node
    command: ["-id", "kv1", "-data", "/data", "-http", "0.0.0.0:8080", "-http-advertise", "http://kv1:8080",
              "-raft", "0.0.0.0:7000", "-raft-advertise", "kv1:7000", "-bootstrap"]
    volumes: [kv1:/data]
    ports: ["8081:8080"]
  kv2:
    <<: *node
    command: ["-id", "kv2", "-data", "/data", "-http", "0.0.0.0:8080", "-http-advertise", "http://kv2:8080",
              "-raft", "0.0.0.0:7000", "-raft-advertise", "kv2:7000", "-join", "http://kv1:8080"]
    volumes: [kv2:/data]
    ports: ["8082:8080"]
    depends_on: [kv1]
  kv3:
    <<: *node
    command: ["-id", "kv3", "-data", "/data", "-http", "0.0.0.0:8080", "-http-advertise", "http://kv3:8080",
              "-raft", "0.0.0.0:7000", "-raft-advertise", "kv3:7000", "-join", "http://kv1:8080"]
    volumes: [kv3:/data]
    ports: ["8083:8080"]
    depends_on: [kv1]
  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]

volumes:
  kv1:
  kv2:
  kv3:
